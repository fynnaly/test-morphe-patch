name: Verify Wibuku patches
on:
  pull_request:
    paths:
      - 'patches/src/main/kotlin/app/template/patches/wibuku/**'
      - 'scripts/test_wibuku_shapes.py'
      - '.github/workflows/verify-wibuku.yml'
permissions:
  contents: read
  packages: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Check Wibuku patch shapes and guards
        run: python3 scripts/test_wibuku_shapes.py
      - name: Compile patch bundle and metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid :patches:generatePatchesList --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: wibuku-patches-candidate
          path: |
            patches/build/libs/patches-*.mpp
            patches-list.json
